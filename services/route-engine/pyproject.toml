[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-engine"
version = "0.1.0"
description = "Pure-Python engine that turns a shape, a distance and a start point into a real route."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "osmnx>=2.1,<3",
    "pillow>=10,<13",
    "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9.2",
    "ruff>=0.5",
    "black>=24",
]

[tool.setuptools.packages.find]
include = ["route_engine*"]

# The shape outlines and the letters are read at import (ADR-0035, ADR-0036,
# ADR-0044).
[tool.setuptools.package-data]
"route_engine" = ["letters.json"]
"route_engine.shapes" = ["outlines/*.json"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after this many seconds prints where every thread
# is, and goes on: a run that hangs says where (TASK-248).
faulthandler_timeout = 120
markers = [
    "network: needs internet access; excluded from normal runs and CI",
]
