[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaperoute-api"
version = "0.1.0"
description = "HTTP API that exposes the route engine to the app."
requires-python = ">=3.11"
# route-engine and shaperoute-ai are installed beside it from ../route-engine
# and ../ai (docs/SETUP.md).
dependencies = [
    "route-engine",
    "shaperoute-ai",
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    # Accounts (TASK-114, ADR-0115): PostgreSQL and Argon2id password hashes.
    # The pool keeps the requests' connections open (TASK-288 B, ADR-0249).
    "psycopg[binary,pool]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9.2",
    "ruff>=0.5",
    "black>=24",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
include = ["shaperoute_api*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after this many seconds prints where every thread
# is, and goes on: a run that hangs says where (TASK-248).
faulthandler_timeout = 120
markers = [
    "network: needs internet access; excluded from normal runs and CI",
]
