[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaperoute-ai"
version = "0.1.0"
description = "Reads the words of the shape field and picks a shape of the catalogue."
requires-python = ">=3.11"
# Standard library only: the model runs in Ollama, called over HTTP (ADR-0012).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9.2",
    "ruff>=0.5",
    "black>=24",
]

[tool.setuptools.packages.find]
include = ["shaperoute_ai*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access; excluded from normal runs and CI",
]
