name: CI

# CI volutamente minima: lint e test sul route-engine, che esiste da
# TASK-010, e sugli script di tools/ (TASK-019); da TASK-020, lint, formato,
# tipi e test dell'app e dei tipi condivisi (job "mobile"); da TASK-022,
# lint e test dell'API (job "api"); da TASK-030, lint e test del pacchetto
# dell'AI (job "ai"), senza nessun modello vero.
# La cache di pip ha per chiave il pyproject.toml del route-engine: finché
# le dipendenze non cambiano, OSMnx e il resto non si riscaricano a ogni run.
# Ogni job ha un tempo massimo, almeno il doppio del suo tempo normale
# (TASK-248): senza, un test che non termina tiene il job sei ore. Dove si è
# fermato lo dice `faulthandler_timeout` nei pyproject.toml.
#
# Una PR di soli documenti (TASK-393, ADR-0331) non fa girare i test: ogni
# job prima guarda cosa cambia con tools/ci_changes.py (docs/ e i .md fuori
# da apps, packages, services, tools, site, deploy) e salta gli altri passi.
# Il job finisce verde con lo stesso nome, così i check obbligatori del
# ruleset di main (route-engine, mobile, api, ai) non restano «Expected»
# come farebbero con un filtro `paths` in `on:`. Su main gira sempre tutto.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuovo su una PR cancella il run ancora in corso della stessa PR.
# Su main ogni run ha un gruppo suo: nessuno aspetta né viene cancellato.
# I gruppi valgono per tutto il repository: site.yml ha i suoi, «site-».
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  route-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        run: python3 tools/ci_changes.py

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/route-engine/pyproject.toml

      - name: Install
        if: steps.changes.outputs.code == 'true'
        working-directory: services/route-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        working-directory: services/route-engine
        run: |
          ruff check .
          black --check .

      # I test marcati "network" restano esclusi: dipendono da dati esterni
      # e fallirebbero per motivi che non riguardano il codice.
      # Vedi docs/TESTING.md.
      - name: Test
        if: steps.changes.outputs.code == 'true'
        working-directory: services/route-engine
        run: pytest -m "not network"

      # Gli script di tools/ usano solo la libreria standard: bastano gli
      # strumenti già installati sopra, con le regole del route-engine.
      - name: Tools
        if: steps.changes.outputs.code == 'true'
        run: |
          ruff check --config services/route-engine/pyproject.toml tools
          black --check --config services/route-engine/pyproject.toml tools
          pytest tools

  # L'API FastAPI, installata insieme al route-engine che espone (ADR-0030).
  # I test girano sul grafo piccolo di Levico e sui JSON di shared-types.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        run: python3 tools/ci_changes.py

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/route-engine/pyproject.toml
            services/ai/pyproject.toml
            services/api/pyproject.toml

      - name: Install
        if: steps.changes.outputs.code == 'true'
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ../route-engine -e ../ai -e ".[dev]"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        working-directory: services/api
        run: |
          ruff check .
          black --check .

      - name: Test
        if: steps.changes.outputs.code == 'true'
        working-directory: services/api
        run: pytest -m "not network"

  # Il pacchetto che legge le parole della forma (ADR-0012): solo libreria
  # standard. I test usano un modello finto e un server HTTP locale finto;
  # Ollama non c'è, e measure_phrases.py non gira qui.
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        run: python3 tools/ci_changes.py

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml

      - name: Install
        if: steps.changes.outputs.code == 'true'
        working-directory: services/ai
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        working-directory: services/ai
        run: |
          ruff check .
          black --check .

      - name: Test
        if: steps.changes.outputs.code == 'true'
        working-directory: services/ai
        run: pytest -m "not network"

  # App Expo e packages/shared-types, workspace npm dalla radice (ADR-0028).
  # La cache di npm ha per chiave package-lock.json.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        run: python3 tools/ci_changes.py

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: npm test

  # L'immagine Docker dell'API (TASK-081, ADR-0076): si costruisce e si
  # prova che risponde a /health, con e senza chiave; non si pubblica.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        run: python3 tools/ci_changes.py

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: docker build -t shaperoute-api:ci .

      - name: Smoke test
        if: steps.changes.outputs.code == 'true'
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SHAPEROUTE_API_KEY=ci-key-only-for-this-run shaperoute-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-API-Key: ci-key-only-for-this-run' http://127.0.0.1:8000/docs)" = 200

      - name: Log
        if: always() && steps.changes.outputs.code == 'true'
        run: docker logs api || true

      # La configurazione del server della strada F (TASK-144, ADR-0111):
      # deploy/compose.yaml con il .env copiato dal modello, data/ del
      # checkout e catalog/ montati, la porta solo su 127.0.0.1. Da
      # TASK-122 (ADR-0123) anche il database: un'iscrizione vera, poi una
      # copia notturna fatta subito e il suo ripristino in un database a
      # parte; senza Storage Box il servizio offsite lascia le copie qui.
      - name: Compose
        if: steps.changes.outputs.code == 'true'
        run: |
          docker rm -f api
          cp .env.example deploy/.env
          sed -i 's/^SHAPEROUTE_API_KEY=.*/SHAPEROUTE_API_KEY=ci-key-only-for-this-run/' deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci0only0for0this0run/' deploy/.env
          cd deploy
          docker compose --profile ai --profile public config --quiet
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-API-Key: ci-key-only-for-this-run' http://127.0.0.1:8000/docs)" = 200
          test "$(stat -c %u ../data/cache)" = 10001
          curl -fsS -H 'X-API-Key: ci-key-only-for-this-run' \
            'http://127.0.0.1:8000/recommended-routes?lat=46.067&lon=11.1215' \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["routes"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-API-Key: ci-key-only-for-this-run' http://127.0.0.1:8000/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'X-API-Key: ci-key-only-for-this-run' -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","username":"ci_runner","at_least_16":true}' \
            http://127.0.0.1:8000/accounts)" = 201
          docker compose exec -T backup bash /backup.sh now
          docker compose exec -T backup bash /backup.sh check | tee /dev/stderr | grep -q ' 1 accounts'
          test "$(stat -c %a ../data/backups/shaperoute-*.dump)" = 600
          docker compose exec -T offsite bash /backup.sh push | grep -q 'stay on this server'
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SHAPEROUTE_DOMAIN=api.example.com caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Compose log
        if: always() && steps.changes.outputs.code == 'true'
        run: docker compose -f deploy/compose.yaml logs || true

      # Raspberry Pi 5 e Oracle Ampere sono ARM64: l'immagine deve
      # costruirsi anche per loro (emulata con QEMU, solo la build).
      - uses: docker/setup-qemu-action@v3
        if: steps.changes.outputs.code == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.code == 'true'

      - name: Build for ARM64
        if: steps.changes.outputs.code == 'true'
        run: docker buildx build --platform linux/arm64 -t shaperoute-api:arm64 .
