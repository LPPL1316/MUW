name: Site

# Il sito web (TASK-237, docs/SITO.md): HTML, CSS e JS statici in site/,
# senza dipendenze. I test vogliono solo Node, quindi niente `npm ci`.
# Gira quando cambia il sito, il testo «Privacy» dell'app che le pagine
# della privacy copiano, o l'elenco dei file copiati sul server.

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      # The privacy pages copy the app's text, and the server's copy is
      # listed in DEPLOY.md: the tests check both stay in step.
      - "apps/mobile/src/about/content/**"
      - "docs/DEPLOY.md"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      # The privacy pages copy the app's text, and the server's copy is
      # listed in DEPLOY.md: the tests check both stay in step.
      - "apps/mobile/src/about/content/**"
      - "docs/DEPLOY.md"

# Come in ci.yml (TASK-393, ADR-0331): un push nuovo su una PR cancella il
# run ancora in corso; su main ogni run ha un gruppo suo. I filtri `paths`
# qui bastano, «site» non è un check obbligatorio; e i test leggono
# docs/DEPLOY.md, quindi qui una PR di soli documenti può far girare tutto.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test
        working-directory: site
        run: npm test
